<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E5A88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8842B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5A623;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="url(#bg)"/>

  <!-- 试卷/论文纸造型 -->
  <rect x="110" y="80" width="292" height="352" rx="8" fill="#f8f5ee" opacity="0.95"/>
  <rect x="110" y="80" width="292" height="36" rx="8" fill="url(#accent)" opacity="0.9"/>
  <rect x="110" y="80" width="292" height="36" rx="0" fill="url(#accent)" opacity="0.9"/>
  <rect x="110" y="108" width="292" height="8" rx="0" fill="#d4a574" opacity="0.5"/>

  <!-- 论文标题行 -->
  <rect x="138" y="138" width="120" height="8" rx="4" fill="#2E5A88" opacity="0.8"/>
  <rect x="138" y="156" width="80" height="6" rx="3" fill="#888" opacity="0.5"/>

  <!-- 公式：σ (Sigma) 求和符号，代表数学建模 -->
  <path d="M 220 200
           L 200 200
           L 230 230
           L 200 260
           L 220 260
           L 250 230
           Z"
        fill="#2E5A88" opacity="0.85"/>

  <!-- 增长曲线（代表优化/预测） -->
  <path d="M 140 300
           Q 180 295 200 275
           Q 220 255 250 245
           Q 280 235 310 215
           Q 340 195 370 200"
        fill="none" stroke="#E8842B" stroke-width="4" stroke-linecap="round" opacity="0.95"/>

  <!-- 数据点 -->
  <circle cx="150" cy="298" r="4" fill="#E8842B" opacity="0.8"/>
  <circle cx="210" cy="270" r="4" fill="#E8842B" opacity="0.8"/>
  <circle cx="270" cy="240" r="4" fill="#E8842B" opacity="0.8"/>
  <circle cx="330" cy="208" r="4" fill="#E8842B" opacity="0.8"/>
  <circle cx="370" cy="200" r="5" fill="#E8842B" opacity="1"/>

  <!-- 下方表格线（代表数据/表格） -->
  <rect x="138" y="340" width="236" height="1" rx="0.5" fill="#ccc" opacity="0.7"/>
  <rect x="138" y="356" width="236" height="1" rx="0.5" fill="#ccc" opacity="0.7"/>
  <rect x="138" y="372" width="236" height="1" rx="0.5" fill="#ccc" opacity="0.7"/>
  <rect x="138" y="388" width="236" height="1" rx="0.5" fill="#ccc" opacity="0.7"/>
  <rect x="210" y="340" width="1" height="48" rx="0.5" fill="#ccc" opacity="0.7"/>
  <rect x="280" y="340" width="1" height="48" rx="0.5" fill="#ccc" opacity="0.7"/>

  <!-- 表格数据条 -->
  <rect x="145" y="345" width="40" height="6" rx="3" fill="#2E5A88" opacity="0.4"/>
  <rect x="215" y="345" width="50" height="6" rx="3" fill="#2E5A88" opacity="0.6"/>
  <rect x="285" y="345" width="70" height="6" rx="3" fill="#E8842B" opacity="0.8"/>
  <rect x="145" y="360" width="55" height="6" rx="3" fill="#2E5A88" opacity="0.3"/>
  <rect x="215" y="360" width="35" height="6" rx="3" fill="#2E5A88" opacity="0.5"/>
  <rect x="285" y="360" width="55" height="6" rx="3" fill="#2E5A88" opacity="0.6"/>
  <rect x="145" y="375" width="30" height="6" rx="3" fill="#2E5A88" opacity="0.2"/>
  <rect x="215" y="375" width="60" height="6" rx="3" fill="#E8842B" opacity="0.7"/>
  <rect x="285" y="375" width="45" height="6" rx="3" fill="#2E5A88" opacity="0.5"/>

  <!-- 星/奖章角标（代表国一水准） -->
  <polygon points="390,70 396,88 416,88 400,100 406,118 390,108 374,118 380,100 364,88 384,88"
           fill="#F5A623" opacity="0.9"/>
  <text x="390" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff" font-family="Arial, sans-serif">1</text>

  <!-- 底部文字 -->
  <text x="256" y="458" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff" font-family="Arial, sans-serif" opacity="0.95">国一写作</text>

</svg>
